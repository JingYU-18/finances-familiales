<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finances familiales</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efea; --border:#e2e0d9; --border-strong:#cfccc3;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85837c;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --b0:#2a78d6; --b1:#6da7ec; --b2:#9ec5f4;
  --up:#d1342f; --down:#16833e; --warn:#a86a00; --warn-bg:#fdf3dc; --danger:#c4332f;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#222220; --border:#2e2d2a; --border-strong:#3d3c38;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --accent-soft:#1c2b3f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --b0:#3987e5; --b1:#256abf; --b2:#184f95;
    --up:#ef6a62; --down:#3fb46a; --warn:#e2a93b; --warn-bg:#33290f; --danger:#ef6a62;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px}
header.top h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.02em}
header.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:#1baf7a}.sync.busy .dot{background:#eda100}.sync.err .dot{background:var(--danger)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:20px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;color:var(--text-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--text);margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:1.4fr 1fr}
.half{grid-template-columns:1fr 1fr}
@media (max-width:860px){.two,.half{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px}
.kpi .lab{color:var(--text-2);font-size:12.5px}
.kpi .val{font-size:clamp(19px,2vw,24px);overflow-wrap:anywhere;font-weight:650;margin-top:4px;letter-spacing:-.01em}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.hero{grid-column:span 2}
.kpi.hero .val{font-size:clamp(24px,2.6vw,32px)}
.kpi .val{overflow-wrap:normal!important}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.section-head h2{font-size:17px;margin:0;font-weight:650}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--border-strong);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.row-actions.v{flex-direction:column;align-items:flex-end}
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--text-2);font-weight:500;font-size:12.5px;background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--border-strong);border-bottom:none}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--surface-2);color:var(--text-2);font-size:12px}
.note{color:var(--muted);font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}.warn{color:var(--warn)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{min-width:130px;text-align:center;font-size:15px}
/* charts */
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:520px;height:auto;display:block;overflow:visible}
a{color:var(--accent)}
.axis text{fill:var(--muted);font-size:11px}
.gridline{stroke:var(--border);stroke-width:1}
.baseline{stroke:var(--border-strong);stroke-width:1}
.grp .hl{fill:var(--text);opacity:0;transition:opacity .1s}
.grp:hover .hl{opacity:.05}
.pt .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.pt:hover .cross{opacity:1}
.pt circle{stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.stack div{height:100%;min-width:2px}
.alloc-list{display:grid;gap:8px}
.alloc-list .it{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.alloc-list .it > span:first-child{display:flex;align-items:center;gap:8px}
.alloc-list i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hbar .fill.over{background:var(--s2)}
.hbar .v{min-width:110px;text-align:right}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:var(--s1);border-radius:4px}
.progress div.over{background:var(--s2)}
.list{display:grid;gap:0}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.list .li:last-child{border-bottom:none}
.struct{display:grid}
.srow{display:grid;grid-template-columns:minmax(150px,1.3fr) 1fr 136px 44px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.srow .v{white-space:nowrap}
.srow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .v,.srow .p{text-align:right}.srow .p{color:var(--muted);font-size:12px}
.srow .track{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.srow .fill{height:100%;border-radius:0 4px 4px 0;background:var(--b0)}
.srow.l0{font-weight:600;padding-top:9px}
.srow.l1 .lbl{padding-left:16px;color:var(--text-2)}.srow.l1 .fill{background:var(--b1)}.srow.l1 .track{height:8px}
.srow.l2{font-size:12.5px;padding:4px 0;border-bottom-style:dashed}.srow.l2 .lbl{padding-left:32px;color:var(--text-2)}.srow.l2 .fill{background:var(--b2)}.srow.l2 .track{height:6px}
.srow.l3{font-size:12px;padding:3px 0;border-bottom-style:dotted}.srow.l3 .lbl{padding-left:48px;color:var(--muted)}.srow.l3 .fill{background:var(--b2);opacity:.7}.srow.l3 .track{height:5px}
.srow.zero .lbl,.srow.zero .v{color:var(--muted)}
.srow.tot{font-weight:650;border-bottom:none;border-top:1px solid var(--border-strong);margin-top:2px}
@media (max-width:560px){.srow.l3 .lbl{padding-left:36px}.srow{grid-template-columns:1fr 96px 38px}.srow .track{display:none}}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.5;z-index:50;opacity:0;transition:opacity .08s;max-width:240px;white-space:nowrap}
#tip.on{opacity:1}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:40px 14px;overflow:auto}
.mask.on{display:flex}
.dialog{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);border:1px solid var(--border)}
.dialog h4{margin:0 0 14px;font-size:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px}
.form .f.full{grid-column:1/-1}
.form label{font-size:12.5px;color:var(--text-2)}
.form label em{color:var(--danger);font-style:normal}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);width:100%}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.form .help{font-size:11.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:none;background:transparent;padding:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:1em}
@media (max-width:560px){.form{grid-template-columns:1fr}.wrap{padding:0 12px 50px}.kpi .val{font-size:21px}.kpi.hero .val{font-size:25px}.hbar{grid-template-columns:70px 1fr auto}.hbar .v{min-width:80px}}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%;min-height:160px;padding:10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2)}
.settings-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:860px){.settings-grid{grid-template-columns:1fr}}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.dialog.wide{max-width:min(1500px,96vw)}
.qwrap{overflow:auto;max-height:62vh;border:1px solid var(--border);border-radius:10px}
.qgrid{font-size:12.5px}.qgrid th,.qgrid td{padding:4px 5px;border-bottom:1px solid var(--border)}
.qgrid thead th{position:sticky;top:0;z-index:1;background:var(--surface-2)}
.qgrid select,.qgrid input{padding:5px 6px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);font-size:12.5px}
.qgrid select[data-f=cat]{width:210px}.qgrid input{width:84px;text-align:right}
.qgrid .qsticky{position:sticky;left:0;z-index:2;background:var(--surface)}.qgrid thead .qsticky{z-index:3;background:var(--surface-2)}
.qgrid tbody tr:hover td{background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="login" style="display:none">
  <form id="loginForm" class="dialog" style="max-width:380px">
    <h4 style="font-size:19px;margin-bottom:4px">Finances familiales</h4>
    <div class="mut" style="font-size:13px;margin-bottom:16px">Connectez-vous pour accéder aux données du foyer.</div>
    <div class="form" style="grid-template-columns:1fr">
      <div class="f"><label>E-mail</label><input id="lgEmail" type="email" autocomplete="username" required></div>
      <div class="f"><label>Mot de passe</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="acts" style="margin-top:10px"><button class="btn primary" id="lgBtn" type="submit" style="width:100%">Se connecter</button></div>
  </form>
</div>
<div class="wrap" id="app" style="display:none">
  <header class="top">
    <div>
      <h1>Finances familiales</h1>
      <div class="sub">Revenus · Dépenses · Placements · Épargne · Immobilier · Dettes — tout le patrimoine familial en un coup d’œil</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Chargement…</span></div>
      <div style="font-size:12px;color:var(--muted)"><span id="who"></span> · <a href="#" id="logout">Se déconnecter</a></div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="tip"></div>
<div class="mask" id="mask"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const curMonth = () => today().slice(0, 7);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const nf2 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const nf0 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
function money(n, opt = {}) {
  n = num(n); const cur = S.settings.currency || '€';
  const s = (opt.int ? nf0 : nf2).format(Math.abs(n));
  return (n < 0 ? '−' : (opt.sign && n > 0 ? '+' : '')) + s + '\u00a0' + cur;
}
const CUR_SYM = { EUR: '€', MAD: 'MAD', XOF: 'F CFA', USD: '$', CNY: '¥' };
const CURS = ['EUR', 'MAD', 'XOF', 'USD', 'CNY'];
const TX_CURS = ['XOF', 'USD', 'EUR', 'MAD', 'CNY'];
const CUR_NAME = { EUR: 'euro', MAD: 'dirham marocain', XOF: 'franc CFA', USD: 'dollar américain', CNY: 'yuan (RMB)' };
const fxRate = code => (!code || code === 'EUR') ? 1 : num((S.settings.fx || {})[code]) || num(DEFAULT_SETTINGS.fx[code]) || 0;
function toBase(v, code) { const r = fxRate(code); return r ? num(v) / r : num(v); }
function moneyIn(n, code, opt = {}) {
  if (!code || code === 'EUR') return money(n, opt);
  n = num(n); const s = ((opt.int || code === 'XOF') ? nf0 : nf2).format(Math.abs(n));
  return (n < 0 ? '−' : (opt.sign && n > 0 ? '+' : '')) + s + '\u00a0' + (CUR_SYM[code] || code);
}
const pv = (x, k) => toBase(x[k], x.currency);
/* Budget : montants convertis dans la devise du budget (XOF par défaut) */
const budCur = () => S.settings.budgetCur || 'XOF';
const toBud = (v, code) => toBase(v, code || 'EUR') * fxRate(budCur());
const amt = x => toBud(x.amount, x.currency || 'EUR');
const mB = (n, opt = {}) => moneyIn(n, budCur(), opt);
const toE = v => num(v) / (fxRate(budCur()) || 1);
const nB = n => { n = num(n); return (n < 0 ? '−' : '') + nf0.format(Math.abs(n)); };
const nfc = new Intl.NumberFormat('fr-FR', {notation: 'compact', maximumFractionDigits: 2});
function wan(n) { return nfc.format(num(n)); }
function pct(n, d = 1) { return isFinite(n) ? (n*100).toFixed(d).replace('.', ',') + '\u00a0%' : '—'; }
const rt = v => num(v).toFixed(2).replace('.', ',') + '\u00a0%';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mDate = m => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1);
function monthLabel(m) { return cap(mDate(m).toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'})); }
function monthShort(m) { return cap(mDate(m).toLocaleDateString('fr-FR', {month: 'short'})); }
function monthLong(m) { return cap(mDate(m).toLocaleDateString('fr-FR', {month: 'long'})); }
const dmy = d => d ? d.split('-').reverse().join('/') : '';
function addMonth(m, k) { let [y, mm] = m.split('-').map(Number); mm += k; while (mm < 1) { mm += 12; y--; } while (mm > 12) { mm -= 12; y++; } return y + '-' + String(mm).padStart(2,'0'); }
function pnlClass(n) { const up = S.settings.colorMode === 'redUp'; return n > 0 ? (up ? 'up' : 'down') : n < 0 ? (up ? 'down' : 'up') : 'mut'; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 1800); }

/* ============ Modèle de données ============ */
const DEFAULT_SETTINGS = {
  currency: '€',
  fx: { MAD: 10.75, XOF: 655.957, USD: 1.12, CNY: 7.77 },
  budgetCur: 'XOF',
  subCats: { 'Vie quotidienne': ['Courses','Repas & restaurants','Vêtements','Loisirs','Sport','Vie sociale','Médical'] },
  catCur: { 'Salaire 1': 'XOF', 'Salaire 2': 'XOF', 'Salaire 3 (euros)': 'EUR' },
  txCur: 'XOF',
  fxDate: '2026-11-13',
  members: ['Moi', 'Conjoint(e)'],
  budget: 0,
  colorMode: 'greenUp',
  catTree: {
    income: [
      {g:'salary', l:'Salaires', cats:['Salaire 1','Salaire 2','Salaire 3 (euros)','Prime']},
      {g:'property', l:'Revenus immobiliers', cats:['Loyers','Autres revenus immobiliers']},
      {g:'invest', l:'Revenus de placements', cats:['Dividendes','Intérêts','Plus-values réalisées']},
      {g:'other', l:'Autres revenus', cats:['Remboursements','Autres revenus']}
    ],
    expense: [
      {g:'fixed', l:'Charges fixes', parent:'Vie courante', cats:['Personnel (ménage, garde…)','Eau, électricité, internet','Transports']},
      {g:'variable', l:'Dépenses variables', parent:'Vie courante', cats:['Vie quotidienne']},
      {g:'property', l:'Dépenses immobilières', cats:['Charges de copropriété','Travaux & entretien','Taxe foncière','Assurance habitation','Mensualité de prêt immobilier']},
      {g:'invest', l:'Épargne & placements', cats:['Versements sur placements','Frais bancaires & de gestion']}
    ]
  }
};
const S = {
  settings: structuredClone(DEFAULT_SETTINGS),
  tx: {},   // 'YYYY-MM' -> [items]
  lists: { invest: [], wealth: [], property: [], debts: [], snapshots: [], recurring: [] }
};

const LISTS = {
  invest: {
    title: 'Placements', desc: 'Actions, fonds, obligations, or… Mettez régulièrement à jour la valeur actuelle pour suivre les plus/moins-values.',

/* ============ Calculs ============ */
function wealthValue(w) {
  if (w.current !== '' && w.current != null && isFinite(parseFloat(w.current))) return num(w.current);
  const p = num(w.principal), r = num(w.rate) / 100;
  if (!w.start || !r) return p;
  let end = today(); if (w.maturity && w.maturity < end) end = w.maturity;
  const d = Math.max(0, daysBetween(w.start, end));
  return p * (1 + r * d / 365);
}
const wMonthly = w => num(w.monthlyFixed) + num(w.monthlyExtra);
function wealthIn12(w) {
  const v = wealthValue(w), r = num(w.rate) / 100, m = wMonthly(w);
  return v * (1 + r) + m * 12 + m * 12 * r * 5.5 / 12;
}
/* Résultat du mois d'une ligne de placement : variation de valeur hors nouveaux apports */
const invStart = x => x.mMonth === curMonth() ? num(x.mStart) : num(x.value);
const invStartCost = x => x.mMonth === curMonth() ? num(x.mCost) : num(x.cost);
const invMonth = x => x.mMonth === curMonth() ? (num(x.value) - invStart(x)) - (num(x.cost) - invStartCost(x)) : 0;
function wealthAtMaturity(w) {
  const p = num(w.principal), r = num(w.rate) / 100;
  if (!w.start || !w.maturity || !r) return null;
  return p * (1 + r * Math.max(0, daysBetween(w.start, w.maturity)) / 365);
}
function totals() {
  const L = S.lists;
  const cash = sum(L.wealth, w => toBase(wealthValue(w), w.currency));
  const inv = sum(L.invest, x => pv(x, 'value'));
  const invCost = sum(L.invest, x => pv(x, 'cost'));
  const prop = sum(L.property, x => pv(x, 'value'));
  const mort = sum(L.property, x => pv(x, 'loan'));
  const debt = sum(L.debts, x => x.balance);
  const assets = cash + inv + prop, liab = mort + debt;
  const monthlyPay = sum(L.property, x => pv(x, 'monthlyPay')) + sum(L.debts, x => x.monthlyPay);
  const rent = sum(L.property, x => pv(x, 'rent'));
  return {cash, inv, invCost, prop, mort, debt, assets, liab, net: assets - liab, monthlyPay, rent};
}
/* Arborescence des catégories */
const tree = () => S.settings.catTree || DEFAULT_SETTINGS.catTree;
const groupsOf = kind => tree()[kind] || [];
const subsMap = () => S.settings.subCats || DEFAULT_SETTINGS.subCats;
const subsOf = cat => subsMap()[cat] || null;
/* Catégorie normalisée : un ancien poste devenu « détail » est rattaché à sa catégorie parente */
function txCat(x) {
  const c = x.category || 'Sans catégorie';
  if (subsOf(c)) return { cat: c, detail: x.detail || '' };
  for (const [p, subs] of Object.entries(subsMap())) if (subs.includes(c)) return { cat: p, detail: c };
  return { cat: c, detail: '' };
}
const catLabel = x => { const t = txCat(x); return t.detail ? t.cat + ' · ' + t.detail : t.cat; };
function txGroup(x) {
  const cat = txCat(x).cat;
  for (const g of groupsOf(x.kind)) if (g.cats.includes(cat)) return g.g;
  return x.group && groupsOf(x.kind).some(g => g.g === x.group) ? x.group : 'other';
}
function groupName(kind, gid) {
  const g = groupsOf(kind).find(z => z.g === gid);
  if (!g) return kind === 'income' ? 'Autres revenus' : 'Autres dépenses';
  return g.parent ? g.parent + ' · ' + g.l : g.l;
}
/* Regroupe les opérations d'un type : [{g, l, parent, v, cats:[{l, v}]}] */
function aggregate(items, kind) {
  const agg = {}, det = {};
  items.filter(x => x.kind === kind).forEach(x => {
    const g = txGroup(x), t = txCat(x), c = t.cat;
    (agg[g] = agg[g] || {})[c] = (agg[g][c] || 0) + amt(x);
    if (subsOf(c)) { const d = (det[c] = det[c] || {}); d[t.detail] = (d[t.detail] || 0) + amt(x); }
  });
  const mk = (c, v) => {
    const o = {l: c, v}; const subs = subsOf(c);
    if (subs) { const d = det[c] || {}; o.subs = [...subs, ...Object.keys(d).filter(k => k && !subs.includes(k))].map(k => ({l: k, v: d[k] || 0})); if (d['']) o.subs.push({l: 'Sans détail', v: d['']}); }
    return o;
  };
  const groups = groupsOf(kind).map(g => {
    const a = agg[g.g] || {};
    const cats = [...g.cats, ...Object.keys(a).filter(c => !g.cats.includes(c))].map(c => mk(c, a[c] || 0));
    return {g: g.g, l: g.l, parent: g.parent, cats, v: sum(cats, c => c.v)};
  });
  if (agg.other && !groupsOf(kind).some(g => g.g === 'other')) {
    const cats = Object.entries(agg.other).map(([l, v]) => mk(l, v));
    groups.push({g: 'other', l: kind === 'income' ? 'Autres revenus' : 'Autres dépenses', cats, v: sum(cats, c => c.v), extra: true});
  }
  return groups;
}
/* Répartition des dépenses : vie courante (fixes / variables), immobilier, placements, autres */
function expSplit(items) {
  const G = aggregate(items, 'expense');
  const pick = id => (G.find(g => g.g === id) || {v: 0}).v;
  const life = sum(G.filter(g => g.parent), g => g.v);
  return {life, fixed: pick('fixed'), variable: pick('variable'), prop: pick('property'), inv: pick('invest'),
    other: sum(G.filter(g => !g.parent && !['property', 'invest'].includes(g.g)), g => g.v)};
}
function incSplit(items) {
  const G = aggregate(items, 'income'), pick = id => (G.find(g => g.g === id) || {v: 0}).v;
  return {salary: pick('salary'), prop: pick('property'), inv: pick('invest'), other: sum(G.filter(g => !['salary', 'property', 'invest'].includes(g.g)), g => g.v)};
}
function salaryByMember(items) {
  const m = {}; S.settings.members.forEach(n => m[n] = 0);
  items.filter(x => x.kind === 'income' && txGroup(x) === 'salary').forEach(x => { const k = x.member || 'Commun'; m[k] = (m[k] || 0) + amt(x); });
  return m;
}
/* Lignes hiérarchiques pour l'affichage. depth 1 = groupes (+ membres / sous-totaux), 2 = jusqu'aux catégories */
function structRows(items, kind, depth) {
  const rows = [], G = aggregate(items, kind);
  if (kind === 'income') {
    for (const g of G) {
      if (g.extra && !g.v) continue;
      if (g.g === 'other' && !g.v && depth < 2) continue;
      rows.push({l: g.l, v: g.v, lvl: 0});
      if (g.g === 'salary') {
        g.cats.forEach(c => { if (c.v || depth >= 2 || /^Salaire \d/.test(c.l)) rows.push({l: c.l, v: c.v, lvl: 1}); });
      } else if (depth >= 2) g.cats.forEach(c => rows.push({l: c.l, v: c.v, lvl: 1}));
    }
  } else {
    const done = new Set();
    for (const g of G) {
      if (g.parent) {
        if (done.has(g.parent)) continue; done.add(g.parent);
        const kids = G.filter(z => z.parent === g.parent);
        rows.push({l: g.parent, v: sum(kids, z => z.v), lvl: 0});
        for (const k of kids) { rows.push({l: k.l, v: k.v, lvl: 1}); if (depth >= 2) k.cats.forEach(c => { rows.push({l: c.l, v: c.v, lvl: 2}); (c.subs || []).forEach(d => rows.push({l: d.l, v: d.v, lvl: 3})); }); }
      } else {
        if (g.extra && !g.v) continue;
        rows.push({l: g.l, v: g.v, lvl: 0});
        if (depth >= 2) g.cats.forEach(c => rows.push({l: c.l, v: c.v, lvl: 1}));
      }
    }
  }
  return rows;
}
function structView(rows, total, totalLabel) {
  return `<div class="struct">${rows.map(r => `<div class="srow l${r.lvl}${r.v ? '' : ' zero'}" ${r.v ? tipAttr(`<b>${esc(r.l)}</b><br>${mB(r.v)}${total ? ' · ' + pct(r.v / total) + ' du total' : ''}`) : ''}>
    <span class="lbl">${esc(r.l)}</span><div class="track"><div class="fill" style="width:${total && r.v ? Math.max(0.5, r.v / total * 100) : 0}%"></div></div>
    <span class="v num">${r.v ? mB(r.v, {int:1}) : '—'}</span><span class="p num">${total && r.v ? pct(r.v / total, 0) : ''}</span></div>`).join('')}
    <div class="srow tot"><span class="lbl">${totalLabel}</span><span></span><span class="v num">${mB(total, {int:1})}</span><span></span></div></div>`;
}
function monthTotals(m) {
  const items = S.tx[m] || [];
  const inc = sum(items.filter(x => x.kind === 'income'), amt);
  const exp = sum(items.filter(x => x.kind === 'expense'), amt);
  return {m, inc, exp, bal: inc - exp, items};
}

function applyDoc(path, body) {
  const [kind, key] = path.split('/'); body = body || {};
  if (kind === 'tx') S.tx[key] = Array.isArray(body.items) ? body.items.map(x => ({...x})) : [];
  else if (key === 'settings') S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), body);
  else if (key in S.lists) S.lists[key] = Array.isArray(body.items) ? body.items.map(x => ({...x})) : [];

const queue = {}, inflight = {};
const busy = path => !!(queue[path] || inflight[path]);
function persist(kind, key) {
  if (!store.user) return;
  let data;
  if (kind === 'tx') data = { items: S.tx[key] || [] };
  else if (key === 'settings') data = { ...S.settings };
  else data = { items: S.lists[key] };
  const path = kind + '/' + key;
  queue[path] = JSON.parse(JSON.stringify(data));
  pump(path);
}
async function pump(path) {
  if (inflight[path]) return;
  inflight[path] = true;
  while (queue[path]) {
    const data = queue[path]; delete queue[path];
    setSync('busy', 'Enregistrement…');
    let { error } = await sb.from(TABLE).upsert({ path, data, updated_at: new Date().toISOString() });
    if (error) { await sleep(600 + Math.random() * 800); ({ error } = await sb.from(TABLE).upsert({ path, data, updated_at: new Date().toISOString() })); }
    if (error) saveFail(error);
  }
  inflight[path] = false;
  if (!Object.values(inflight).some(Boolean) && $('#sync').className.indexOf('err') < 0) setSync('ok', 'Synchronisé');
}
function saveFail(e) {
  console.error(e);
  if (e && (e.code === '42501' || /row-level security|permission/i.test(e.message || ''))) setSync('err', 'Accès refusé : compte non autorisé');
  else setSync('err', 'Échec de l’enregistrement, réessayez');
}
async function loadAll() {
  setSync('busy', 'Chargement…');
  const { data, error } = await sb.from(TABLE).select('path,data');
  if (error) { console.error(error); setSync('err', 'Échec de lecture des données'); return; }
  S.tx = {}; for (const k of Object.keys(S.lists)) S.lists[k] = []; S.settings = structuredClone(DEFAULT_SETTINGS);
  data.forEach(r => applyDoc(r.path, r.data));
  store.loaded = true;
  if (!data.length && store.user) showBanner('empty');
  setSync('ok', 'Synchronisé'); render();
  runRecurring();
}
function subscribe() {
  if (store.channel) sb.removeChannel(store.channel);
  store.channel = sb.channel('ledger')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, p => {
      const row = p.new && p.new.path ? p.new : p.old;
      if (!row || !row.path || busy(row.path)) return;
      if (p.eventType === 'DELETE') applyDoc(row.path, {}); else applyDoc(row.path, p.new.data);
      render();
    })
    .subscribe(status => { if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSync('err', 'Synchronisation en direct interrompue — rechargez la page'); });
}

/* ---------- Graphiques ---------- */
function niceScale(maxV, ticks = 4) {
  if (maxV <= 0) maxV = 1;
  const raw = maxV / ticks, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  return { step, max: Math.ceil(maxV / step) * step };
}
function barPath(x, y, w, h, r = 4) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}

function chartCashflow(months) {

  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="gridline" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${wan(v)}</text>`;
  const gw = iw / months.length, bw = Math.max(4, Math.min(16, (gw - 12) / 2));
  let bars = '';
  months.forEach((d, i) => {
    const cx = pl + i * gw + gw / 2;
    const es = expSplit(d.items), is = incSplit(d.items);
    const tip = `<b>${monthLabel(d.m)}</b><br>Revenus ${mB(d.inc)}<span style="opacity:.75"><br>· salaires ${mB(is.salary, {int:1})}<br>· immobilier ${mB(is.prop, {int:1})}<br>· placements ${mB(is.inv, {int:1})}${is.other ? `<br>· autres ${mB(is.other, {int:1})}` : ''}</span><br>Dépenses ${mB(d.exp)}<span style="opacity:.75"><br>· vie courante ${mB(es.life, {int:1})}<br>· immobilier ${mB(es.prop, {int:1})}<br>· placements ${mB(es.inv, {int:1})}${es.other ? `<br>· autres ${mB(es.other, {int:1})}` : ''}</span><br>Solde ${mB(d.bal)}`;
    bars += `<g class="grp" ${tipAttr(tip)}><rect class="hl" x="${pl+i*gw+1}" y="${pt}" width="${gw-2}" height="${ih}" rx="6"/>`
      + `<path d="${barPath(cx - bw - 1, y(d.inc), bw, pt + ih - y(d.inc))}" fill="var(--s1)"/>`
      + `<path d="${barPath(cx + 1, y(d.exp), bw, pt + ih - y(d.exp))}" fill="var(--s2)"/>`
      + `<text x="${cx}" y="${H-8}" text-anchor="middle">${monthShort(d.m)}</text>`
      + `<rect x="${pl+i*gw}" y="${pt}" width="${gw}" height="${ih+pb}" fill="transparent"/></g>`;
  });
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Revenus</span><span><i style="background:var(--s2)"></i>Dépenses</span></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses sur 12 mois"><g class="axis">${g}</g><line class="baseline" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/><g class="axis">${bars}</g></svg></div>`;
}
function chartNetWorth(snaps) {
  if (snaps.length < 2) return `<div class="empty">Le patrimoine net est enregistré automatiquement chaque mois ; la courbe apparaît à partir de deux mois.</div>`;
  const W = 680, H = 210, pl = 50, pr = 14, pt = 12, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const vals = snaps.map(s => s.a - s.l);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const { step, max } = niceScale(hi - lo || 1);
  lo = Math.floor(lo / step) * step; const top = lo + Math.ceil((hi - lo) / step) * step || lo + step;
  const y = v => pt + ih - ((v - lo) / (top - lo)) * ih;
  const x = i => pl + (snaps.length === 1 ? iw / 2 : i * iw / (snaps.length - 1));
  let g = '';
  for (let v = lo; v <= top + 1e-9; v += step) g += `<line class="gridline" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${wan(v)}</text>`;
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const every = Math.ceil(snaps.length / 8);
  let marks = '';
  snaps.forEach((s, i) => {
    const hw = iw / Math.max(1, snaps.length - 1) / 2;
    const tip = `<b>${monthLabel(s.m)}</b><br>Patrimoine net ${money(s.a - s.l)}<br>Actifs ${money(s.a)}<br>Dettes ${money(s.l)}`;
    marks += `<g class="pt" ${tipAttr(tip)}><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt+ih}"/>`
      + `<circle cx="${x(i)}" cy="${y(vals[i])}" r="4" fill="var(--s1)"/>`
      + (i % every === 0 || i === snaps.length - 1 ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${s.m.slice(5)}/${s.m.slice(2,4)}</text>` : '')
      + `<rect x="${x(i)-hw}" y="${pt}" width="${hw*2}" height="${ih+pb}" fill="transparent"/></g>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du patrimoine net"><g class="axis">${g}</g><polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/><g class="axis">${marks}</g></svg></div>`;
}
function hbars(rows, budgetMap) {
  if (!rows.length) return `<div class="empty">Aucune donnée</div>`;
  const mx = Math.max(...rows.map(r => r.v));
  const tot = sum(rows, r => r.v);
  return `<div class="hbars">${rows.map(r => `<div class="hbar" ${tipAttr(`<b>${esc(r.k)}</b><br>${money(r.v)} · ${pct(r.v / tot)} du total`)}>
    <span class="lbl">${esc(r.k)}</span><div class="track"><div class="fill" style="width:${Math.max(1, r.v / mx * 100)}%"></div></div><span class="v num">${money(r.v, {int:1})}</span></div>`).join('')}</div>`;
}

function catRows(items, kind) {

}

const REC_DAYS = ['last', 'first', ...Array.from({length: 28}, (_, i) => String(i + 1))];
const recDayLabel = d => d === 'last' ? 'Dernier jour du mois' : d === 'first' ? 'Premier jour du mois' : 'Le ' + d + ' du mois';
const REC_FIELDS = [
  {k:'kind', l:'Type', t:'kind', full:1},
  {k:'category', l:'Catégorie', t:'category', req:1},
  {k:'detail', l:'Détail (facultatif)', t:'detail'},

  {k:'currency', l:'Devise', t:'select', opts:TX_CURS, optLabel: c => c + ' — ' + CUR_NAME[c]},
  {k:'member', l:'Membre', t:'member'},
  {k:'day', l:'Date de passage', t:'select', opts:REC_DAYS, optLabel: recDayLabel, help:'Revenus : par défaut le dernier jour · Charges : le premier jour'},
  {k:'start', l:'À partir de (mois)', t:'month', req:1, help:'Les mois passés sont rattrapés automatiquement'},
  {k:'end', l:'Jusqu’à (facultatif)', t:'month'},
  {k:'note', l:'Note', t:'text', full:1}

function lastDay(m) { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); }
function recDate(t, m) {
  const d = t.day === 'last' ? lastDay(m) : t.day === 'first' ? 1 : Math.min(+t.day || 1, lastDay(m));
  return m + '-' + String(d).padStart(2, '0');
}
/* Crée les opérations échues qui n'existent pas encore (identifiant fixe : pas de doublon) */
function runRecurring() {
  const now = today(), cm = curMonth(), touched = new Set();
  for (const t of S.lists.recurring || []) {
    if (!t.start || t.paused) continue;

    const v = sum(items, x => pv(x, 'value')), l = sum(items, x => pv(x, 'loan')), r = sum(items, x => pv(x, 'rent')), mp = sum(items, x => pv(x, 'monthlyPay'));
    const foreign = items.some(x => x.currency && x.currency !== 'EUR');
    kpis = kpiRow([['Valeur estimée', money(v, {int:1}), '≈ ' + wan(v) + (foreign ? ' · converti en €' : '')], ['Capital restant dû', money(l, {int:1}), v ? 'Ratio prêt/valeur ' + pct(l / v) : ''], ['Valeur nette', money(v - l, {int:1}), '≈ ' + wan(v - l)], ['Mensualités / loyers', money(mp, {int:1}) + ' / ' + money(r, {int:1}), r && mp ? 'Loyers couvrent ' + pct(r / mp, 0) + ' des mensualités' : '']]);
    if (foreign) kpis += `<div class="mut" style="font-size:12px;margin-top:8px">Conversion : 1 € = ${nf2.format(fxRate('MAD'))} MAD (taux saisi le ${esc(dmy(S.settings.fxDate))}, modifiable dans <a href="#settings">Réglages</a>).</div>`;
    const conv = (x, n) => x.currency && x.currency !== 'EUR' && n ? `<div class="mut" style="font-size:12px">≈ ${money(toBase(n, x.currency), {int:1})}</div>` : '';
    const cell = (x, k, extra = '') => `<td class="r num">${num(x[k]) ? moneyIn(x[k], x.currency, {int:1}) + conv(x, num(x[k])) : '<span class="mut">—</span>'}${extra}</td>`;
    head = `<th>Nom</th><th>Type</th><th class="r">Valeur estimée</th><th class="r">Capital restant dû</th><th class="r">Mensualité</th><th class="r">Valeur nette</th><th class="r">Prix d’achat / plus-value</th><th class="r">Loyer / rendement</th><th></th>`;
    body = items.map(x => { const g = num(x.value) - num(x.buyPrice), net = num(x.value) - num(x.loan);
      return `<tr><td><b>${esc(x.name)}</b>${x.address ? `<div class="mut" style="font-size:12px">${esc(x.address)}</div>` : owner(x)}</td>
      <td><span class="tag">${esc(x.type)}</span>${x.usage ? `<div class="mut" style="font-size:12px">${esc(x.usage)}</div>` : ''}</td>
      ${cell(x, 'value')}
      ${cell(x, 'loan', x.loanRate ? `<div class="mut" style="font-size:12px">taux ${rt(x.loanRate)}</div>` : '')}
      ${cell(x, 'monthlyPay')}
      <td class="r num"><b>${moneyIn(net, x.currency, {int:1})}</b>${conv(x, net)}</td>
      <td class="r num">${x.buyPrice ? moneyIn(x.buyPrice, x.currency, {int:1}) + `<div class="${pnlClass(g)}" style="font-size:12px">${moneyIn(g, x.currency, {int:1, sign:1})} (${pct(g / num(x.buyPrice))})</div>` : '<span class="mut">—</span>'}</td>
      <td class="r num">${x.rent ? moneyIn(x.rent, x.currency, {int:1}) + `<div class="mut" style="font-size:12px">${num(x.value) ? pct(num(x.rent) * 12 / num(x.value), 2) + ' / an' : ''}</div>` : '<span class="mut">—</span>'}</td>${act(x).replace('row-actions', 'row-actions v')}</tr>`; }).join('');
    foot = `<tr><td colspan="2">Total${foreign ? ' (en €)' : ''}</td><td class="r num">${money(v, {int:1})}</td><td class="r num">${money(l, {int:1})}</td><td class="r num">${money(mp, {int:1})}</td><td class="r num">${money(v - l, {int:1})}</td><td></td><td class="r num">${money(r, {int:1})}</td><td></td></tr>`;
  } else if (key === 'debts') {
    const t = totals(), b = sum(items, x => x.balance), mp = sum(items, x => x.monthlyPay);
    kpis = kpiRow([['Total des dettes (prêts immo inclus)', money(t.liab, {int:1}), '≈ ' + wan(t.liab)], ['Prêts immobiliers', money(t.mort, {int:1}), 'gérés dans « Immobilier »'], ['Autres dettes', money(b, {int:1}), ''], ['Mensualités totales', money(t.monthlyPay, {int:1}), 'prêts immobiliers inclus']]);
    head = `<th>Nom</th><th>Catégorie</th><th class="r">Restant dû</th><th class="r">Taux</th><th class="r">Mensualité</th><th>Fin</th><th>Reste</th><th></th>`;
    body = items.map(x => { const d = x.endDate ? daysBetween(today(), x.endDate) : null;
      return `<tr><td><b>${esc(x.name)}</b>${owner(x)}</td><td><span class="tag">${esc(x.type)}</span></td><td class="r num">${money(x.balance)}</td><td class="r num">${x.rate ? rt(x.rate) : '—'}</td><td class="r num">${x.monthlyPay ? money(x.monthlyPay) : '—'}</td><td class="num mut">${esc(dmy(x.endDate) || '—')}</td><td>${d == null ? '<span class="mut">—</span>' : d < 0 ? 'Échu' : Math.ceil(d / 30) + ' mois'}</td>${act(x)}</tr>`; }).join('');
    foot = `<tr><td colspan="2">Total</td><td class="r num">${money(b)}</td><td></td><td class="r num">${money(mp)}</td><td></td><td></td><td></td></tr>`;
  }
  return `
  <div class="section-head"><div><h2>${cfg.title}</h2><p>${cfg.desc}</p></div><button class="btn primary" data-add>+ Ajouter</button></div>
  ${kpis}
  <div class="card" style="margin-top:14px">
    ${items.length ? `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>`
      : `<div class="empty">Aucune entrée pour l’instant<br><button class="btn primary" data-add>+ Ajouter la première</button></div>`}
  </div>`;
}
function kpiRow(arr) { return `<div class="grid kpis">${arr.map(([l, v, f]) => `<div class="card kpi"><div class="lab">${l}</div><div class="val num">${v}</div>${f ? `<div class="foot">${f}</div>` : ''}</div>`).join('')}</div>`; }
function typeBreakdown(items, f, title) {
  if (items.length < 2) return '';
  const m = {}; items.forEach(x => m[x.type || 'Autre'] = (m[x.type || 'Autre'] || 0) + f(x));
  const rows = Object.entries(m).map(([k, v]) => ({k, v})).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  return `<div class="card" style="margin-top:14px"><h3>${title}</h3>${hbars(rows)}</div>`;
}

const splitList = s => [...new Set(String(s).split(/[,，、\n]/).map(x => x.trim()).filter(Boolean))];

      S.lists[r] = S.lists[r].filter(x => x.id !== b.dataset.del); persist('lists', r); recordSnapshot(); render(); toast('Supprimé');
    });
  });

    v.querySelectorAll('[data-recdel]').forEach(b => b.onclick = () => confirmBox('Supprimer cette opération automatique ?', 'Les opérations déjà créées sont conservées ; seules les prochaines ne seront plus ajoutées.', () => { S.lists.recurring = S.lists.recurring.filter(x => x.id !== b.dataset.recdel); persist('lists', 'recurring'); render(); toast('Supprimée'); }));

      if (t.dataset.txdup) { const f = findTx(t.dataset.txdup); if (f) { const { recId, qk, ...rest } = f.x; saveTx({ ...rest, id: uid(), date: today(), t: Date.now() }); toast('Dupliqué à la date du jour'); } }
      if (t.dataset.txdel) { const f = findTx(t.dataset.txdel); if (f) confirmBox('Supprimer cette opération ?', `${dmy(f.x.date)} · ${f.x.category} · ${moneyIn(f.x.amount, f.x.currency || 'EUR')}`, () => { S.tx[f.m].splice(f.i, 1); persist('tx', f.m);
        if (f.x.recId) { const t = (S.lists.recurring || []).find(r => r.id === f.x.recId); const mm = f.x.id.slice(-7); if (t) { t.skip = [...new Set([...(t.skip || []), mm])]; persist('lists', 'recurring'); } }
        render(); toast('Supprimé'); }); }
    };

  if (r === 'settings') {

    };
    $('#exp').onclick = () => {
      const json = JSON.stringify({ app: 'family-finance', v: 1, at: new Date().toISOString(), settings: S.settings, tx: S.tx, lists: S.lists }, null, 1);

      $('#expTxt').value = json;

    $('#imp').onclick = () => {
      $('#ioArea').innerHTML = `<input type="file" accept=".json,application/json" id="impFile"><div class="mut" style="font-size:12px;margin:8px 0">ou collez directement le contenu de la sauvegarde :</div><textarea class="code" id="impTxt" placeholder="{ ... }"></textarea><div class="toolbar" style="margin-top:8px"><button class="btn sm primary" id="impGo">Restaurer</button></div><div class="err" id="impErr"></div>`;

          applyAll(d);
          oldMonths.forEach(m => { if (!S.tx[m]) S.tx[m] = []; });
          pushAll(); render(); toast('Restauré');
        });
      };
    };
  }
}
function listForm(key, id) {
  const cfg = LISTS[key];
  let init = id ? S.lists[key].find(x => x.id === id) : { owner: S.settings.members[0] || '', type: cfg.fields.find(f => f.k === 'type').opts[0], ...(['property', 'wealth', 'invest'].includes(key) ? {currency: 'EUR'} : {}) };
  if (key === 'invest' && id) init = { ...init, mStart: invStart(init) };
  openForm((id ? 'Modifier — ' : 'Ajouter — ') + cfg.title, cfg.fields, init, v => {
    const obj = { ...(id ? init : {}), ...v, id: id || uid(), u: today() };
    if (key === 'invest') {
      const m = curMonth(), started = v.mStart !== '';
      if (!id) { obj.mStart = started ? num(v.mStart) : num(v.cost); obj.mCost = num(v.cost); }
      else {
        const old = S.lists[key].find(x => x.id === id);
        if (old.mMonth !== m) {
          obj.hist = { ...(old.hist || {}) }; if (old.mMonth) obj.hist[old.mMonth] = Math.round(((num(old.value) - num(old.mStart)) - (num(old.cost) - num(old.mCost))) * 100) / 100;
          obj.mCost = num(old.cost);
        } else obj.mCost = num(old.mCost);
        obj.mStart = started ? num(v.mStart) : invStart(old);
      }
      obj.mMonth = m;
    }
    if (id) S.lists[key] = S.lists[key].map(x => x.id === id ? obj : x); else S.lists[key].push(obj);
    persist('lists', key); recordSnapshot(); render(); toast(id ? 'Mis à jour' : 'Ajouté');
  });
}

/* ---------- Formulaires ---------- */
function openForm(title, fields, init, onSave, keepOpenOption) {
  const val = k => init && init[k] != null ? init[k] : '';
  const kindNow = () => (dlg.querySelector('[data-kind].on') || {}).dataset?.kind || val('kind') || 'expense';

    const req = f.req ? ' <em>*</em>' : '';

    else if (f.t === 'member') { const ms = [...new Set([...S.settings.members, ...(val(f.k) ? [val(f.k)] : [])])]; inp = `<select name="${f.k}"><option value="">Commun</option>${ms.map(o => `<option ${val(f.k) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }
    else if (f.t === 'kind') inp = `<div class="seg"><button type="button" data-kind="expense" class="${(val('kind') || 'expense') === 'expense' ? 'on' : ''}">Dépense</button><button type="button" data-kind="income" class="${val('kind') === 'income' ? 'on' : ''}">Revenu</button></div>`;
    else if (f.t === 'category') inp = `<select name="category"></select>`;
    else if (f.t === 'detail') inp = `<select name="detail"></select>`;
    else if (f.t === 'textarea') inp = `<textarea name="${f.k}" rows="2">${esc(val(f.k))}</textarea>`;
    else if (f.t === 'money' || f.t === 'number') inp = `<input name="${f.k}" type="number" inputmode="decimal" step="${f.step || '0.01'}" ${f.t === 'money' ? 'min="0"' : ''} value="${esc(val(f.k))}" placeholder="${f.t === 'money' ? '0.00' : ''}">`;
    else if (f.t === 'date') inp = `<input name="${f.k}" type="date" value="${esc(val(f.k))}">`;
    else if (f.t === 'month') inp = `<input name="${f.k}" type="month" value="${esc(val(f.k))}">`;
    else inp = `<input name="${f.k}" type="text" value="${esc(val(f.k))}" placeholder="${esc(f.ph || '')}">`;
    return `<div class="f ${f.full ? 'full' : ''}"><label>${f.l}${req}</label>${inp}${f.help ? `<span class="help">${f.help}</span>` : ''}</div>`;
  };
  dlg.innerHTML = `<h4>${title}</h4><form class="form" id="frm">${fields.map(fieldHtml).join('')}</form><div class="err" id="frmErr"></div>
    <div class="acts">${keepOpenOption ? `<button class="btn" id="fSaveMore" type="button">Enregistrer et continuer</button>` : ''}<button class="btn" id="fCancel" type="button">Annuler</button><button class="btn primary" id="fSave" type="button">Enregistrer</button></div>`;
  const fillCats = () => {
    const sel = dlg.querySelector('select[name=category]'); if (!sel) return;
    const k = kindNow(), cur = sel.value || val('category');
    const known = groupsOf(k).some(g => g.cats.includes(cur));
    let html = cur && !known && val('kind') === k ? `<option selected>${esc(cur)}</option>` : '';
    html += groupsOf(k).map(g => `<optgroup label="${esc(groupName(k, g.g))}">${g.cats.map(c => `<option ${c === cur ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>`).join('');
    sel.innerHTML = html;
  };
  dlg.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { dlg.querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('on', x === b)); dlg.querySelector('select[name=category]').value = ''; fillCats(); });
  fillCats();
  const catSel = dlg.querySelector('select[name=category]'), curSel = dlg.querySelector('select[name=currency]'), detSel = dlg.querySelector('select[name=detail]');
  const fillDet = () => {
    if (!detSel) return;
    const subs = catSel ? subsOf(catSel.value) : null, box = detSel.closest('.f');
    box.style.display = subs ? '' : 'none';
    const cur = detSel.value || val('detail');
    detSel.innerHTML = subs ? `<option value="">— Aucun (${esc(catSel.value)}) —</option>` + subs.map(d => `<option ${d === cur ? 'selected' : ''}>${esc(d)}</option>`).join('') : '';
    if (!subs) detSel.value = '';
  };
  if (detSel) { fillDet(); catSel.addEventListener('change', () => { detSel.value = ''; fillDet(); }); dlg.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { detSel.value = ''; fillDet(); })); }
  if (catSel && curSel) catSel.addEventListener('change', () => { const c = (S.settings.catCur || DEFAULT_SETTINGS.catCur)[catSel.value]; curSel.value = c || S.settings.txCur || 'XOF'; });
  const collect = () => {
    const out = {};
    for (const f of fields) {
      if (f.t === 'kind') { out.kind = kindNow(); continue; }
      const el = dlg.querySelector(`[name="${f.k}"]`); let v = el ? el.value.trim() : '';
      if (f.req && v === '') { $('#frmErr').textContent = `Veuillez renseigner « ${f.l} »`; el && el.focus(); return null; }
      if ((f.t === 'money' || f.t === 'number') && v !== '') { if (!isFinite(parseFloat(v))) { $('#frmErr').textContent = `« ${f.l} » n’est pas un nombre valide`; return null; } v = parseFloat(v); }
      out[f.k] = v;
    }
    const s = out.start, m = out.maturity;
    if (s && m && m < s) { $('#frmErr').textContent = 'L’échéance ne peut pas précéder la date de début'; return null; }
    return out;
  };
  $('#fCancel').onclick = closeModal;
  $('#fSave').onclick = () => { const v = collect(); if (v) { closeModal(); onSave(v); } };
  if (keepOpenOption) $('#fSaveMore').onclick = () => { const v = collect(); if (v) { onSave(v); const keep = { kind: v.kind, date: v.date, member: v.member, currency: v.currency }; openForm(title, fields, keep, onSave, true); } };
  $('#frm').onsubmit = e => { e.preventDefault(); $('#fSave').click(); };
  dlg.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#fSave').click(); } }));
  $('#mask').classList.add('on');
  setTimeout(() => { const first = dlg.querySelector('input[name=amount]') || dlg.querySelector('input[type=text],input[type=number]'); first && first.focus(); }, 30);
}
function confirmBox(title, msg, onYes) {
  $('#dialog').innerHTML = `<h4>${esc(title)}</h4><div style="color:var(--text-2)">${esc(msg)}</div><div class="acts"><button class="btn" id="cNo">Annuler</button><button class="btn primary" id="cYes" style="background:var(--danger);border-color:var(--danger)">Confirmer</button></div>`;
  $('#cNo').onclick = closeModal; $('#cYes').onclick = () => { closeModal(); onYes(); };
  $('#mask').classList.add('on');
}
function closeModal() { $('#mask').classList.remove('on'); $('#dialog').classList.remove('wide'); }
$('#mask').addEventListener('mousedown', e => { if (e.target.id === 'mask') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Infobulles ---------- */
const tip = $('#tip');
function showTip(t, x, y) {
  tip.innerHTML = t.getAttribute('data-tip'); tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tip.classList.remove('on'); });
document.addEventListener('touchstart', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { const p = e.touches[0]; showTip(t, p.clientX, p.clientY); } else tip.classList.remove('on'); }, {passive: true});

initStore();
</script>
